name: tests

on:
  pull_request:
  push:
    branches: [main, epic/recreate, feat/tfmpe]
  workflow_dispatch:
    inputs:
      slow:
        description: Also run the slow fit-backend tests (~5 min)
        type: boolean
        default: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Pytest
        # pyproject deselects slow tests by default; -m "" selects everything.
        run: pytest -q ${{ inputs.slow && '-m ""' || '' }}
